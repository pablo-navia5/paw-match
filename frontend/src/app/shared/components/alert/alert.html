@if (alertMessage()) {
  <div
    class="alert-container"
    [class.error]="alertMessage()?.type === 'error'"
    [class.success]="alertMessage()?.type === 'success'"
    [class.closing]="alertService.isClosing()">

    <span class="alert-message">
      @if (alertMessage()?.type === 'error') {
        ⚠️
      } @else {
        ✅
      }
      {{ alertMessage()?.message }}
    </span>

    <button class="close-btn" (click)="clearAlert()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="24"
           height="24">
        <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
      </svg>
    </button>

  </div>
}
