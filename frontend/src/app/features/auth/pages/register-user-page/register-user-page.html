<div class="form-wrapper">
  <div class="form-card">
    <button class="btn-back" routerLink="/">
      ← Volver al inicio
    </button>

    <div class="form-header">
      <h2>Registro de Adoptante</h2>
      <p class="text-muted">Crea tu perfil y encuentra a tu compañero ideal</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="modern-form">

      <h3 class="section-title">Datos Básicos</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Nombre Completo</label>
          <input type="text" id="name" formControlName="name" placeholder="Ej. Ana García" class="form-control">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="ana@ejemplo.com" class="form-control">
        </div>

        <div class="form-group">
          <label for="password">Contraseña (mín 6 carácteres)</label>
          <input type="password" id="password" formControlName="password" placeholder="••••••••" class="form-control">
        </div>
      </div>

      <hr class="divider">

      <h3 class="section-title">Preferencias de Adopción</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="preferredSpecies">Especie Preferida</label>
          <select id="preferredSpecies" formControlName="preferredSpecies" class="form-control">
            <option value="" disabled selected>Selecciona una especie...</option>
            <option value="Perro">Perro</option>
            <option value="Gato">Gato</option>
          </select>
        </div>

        <div class="form-group">
          <label for="minAgePreference">Edad Mínima (años)</label>
          <input type="number" id="minAgePreference" formControlName="minAgePreference" class="form-control">
        </div>

        <div class="form-group">
          <label for="maxAgePreference">Edad Máxima (años)</label>
          <input type="number" id="maxAgePreference" formControlName="maxAgePreference" class="form-control">
        </div>
      </div>

      <hr class="divider">

      <h3 class="section-title">Tu Estilo de Vida y Hogar</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="houseSize">Tamaño de Casa</label>
          <select id="houseSize" formControlName="houseSize" class="form-control">
            <option value="Pequeña">Pequeña (Piso)</option>
            <option value="Mediana">Mediana (Adosado)</option>
            <option value="Grande">Grande (Finca/Chalet)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="hoursAvailablePerDay">Horas disponibles al día</label>
          <input type="number" id="hoursAvailablePerDay" formControlName="hoursAvailablePerDay" class="form-control">
        </div>

        <div class="form-group">
          <label for="activityLevel">Tu nivel de actividad (1-Bajo, 2-Medio, 3-Alto)</label>
          <input type="number" id="activityLevel" formControlName="activityLevel" min="1" max="3" class="form-control">
        </div>
      </div>

      <div class="checkbox-grid">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasYard" class="custom-checkbox">
          <span>Tengo patio o jardín exterior</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasPreviousExperience" class="custom-checkbox">
          <span>Tengo experiencia previa con mascotas</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasSmallChildren" class="custom-checkbox">
          <span>Tengo niños pequeños en casa</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" formControlName="hasOtherPets" class="custom-checkbox">
          <span>Tengo otras mascotas actualmente</span>
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="registerForm.invalid" class="btn-primary btn-block">
          Crear Cuenta
        </button>
      </div>

    </form>
  </div>
</div>
