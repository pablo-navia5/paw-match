<div style="max-width: 400px; margin: 3rem auto; font-family: sans-serif; padding: 2rem; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Registro de Adoptante</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1rem;">

    <div>
      <label>Nombre Completo:</label>
      <input type="text" formControlName="name" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Email:</label>
      <input type="email" formControlName="email" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Contraseña (mín 6 carácteres):</label>
      <input type="password" formControlName="password" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Especie Preferida:</label>
      <select formControlName="preferredSpecies" style="width: 100%; padding: 0.5rem;">
        <option value="Perro">Perro</option>
        <option value="Gato">Gato</option>
      </select>
    </div>

    <div style="display: flex; gap: 1rem;">
      <div style="flex: 1;">
        <label>Edad Mínima:</label>
        <input type="number" formControlName="minAgePreference" style="width: 100%; padding: 0.5rem;">
      </div>
      <div style="flex: 1;">
        <label>Edad Máxima:</label>
        <input type="number" formControlName="maxAgePreference" style="width: 100%; padding: 0.5rem;">
      </div>
    </div>

    <div>
      <label>Tamaño de Casa:</label>
      <select formControlName="houseSize" style="width: 100%; padding: 0.5rem;">
        <option value="Pequeña">Pequeña</option>
        <option value="Mediana">Mediana</option>
        <option value="Grande">Grande</option>
      </select>
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="hasYard">
        ¿Tienes patio o jardín exterior?
      </label>
    </div>

    <div>
      <label>Horas disponibles al día:</label>
      <input type="number" formControlName="hoursAvailablePerDay" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="hasPreviousExperience">
        ¿Tienes experiencia previa?
      </label>
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="hasSmallChildren">
        ¿Tienes niños pequeños?
      </label>
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="hasOtherPets">
        ¿Tienes otras mascotas?
      </label>
    </div>

    <div>
      <label>Nivel de actividad:</label>
      <input type="number" formControlName="activityLevel" style="width: 100%; padding: 0.5rem;">
    </div>

    <button type="submit" [disabled]="registerForm.invalid" style="padding: 0.8rem; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Crear Cuenta
    </button>

  </form>
</div>
