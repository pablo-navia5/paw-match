<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Iniciar Sesión</h2>
      <p class="text-muted">Bienvenido de nuevo</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Introduce tu email" class="form-control">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••" class="form-control">
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-primary btn-block">
        Entrar
      </button>

    </form>

    @if (userRole) {
      <div class="alert-success">
        ¡Login exitoso! Tu rol es: {{ userRole }}
      </div>
    }
  </div>
</div>
