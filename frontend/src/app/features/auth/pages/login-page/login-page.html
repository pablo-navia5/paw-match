<div class="auth-wrapper">
  <div class="auth-card">
    <button class="btn-back" routerLink="/">
      ← {{ 'AUTH.LOGIN.BACK_TO_HOME' | translate }}
    </button>

    <div class="auth-header">
      <h2>{{ 'AUTH.LOGIN.TITLE' | translate }}</h2>
      <p class="text-muted">{{ 'AUTH.LOGIN.SUBTITLE' | translate }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">{{ 'AUTH.LOGIN.EMAIL_LABEL' | translate }}</label>
        <input type="email" id="email" formControlName="email" [placeholder]="'AUTH.LOGIN.EMAIL_PLACEHOLDER' | translate" class="form-control">
      </div>

      <div class="form-group">
        <label for="password">{{ 'AUTH.LOGIN.PASSWORD_LABEL' | translate }}</label>
        <input type="password" id="password" formControlName="password" [placeholder]="'AUTH.LOGIN.PASSWORD_PLACEHOLDER' | translate" class="form-control">
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loadingService.isLoading()" class="btn-primary btn-block">
        {{ 'AUTH.LOGIN.SUBMIT_BTN' | translate }}
      </button>

    </form>

    @if (userRole) {
      <div class="alert-success">
        {{ 'AUTH.LOGIN.SUCCESS_ROLE' | translate }} {{ userRole }}
      </div>
    }
  </div>
</div>
