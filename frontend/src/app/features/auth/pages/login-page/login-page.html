<div style="max-width: 400px; margin: 3rem auto; font-family: sans-serif; padding: 2rem; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Iniciar Sesión</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1rem;">

    <div>
      <label>Email:</label>
      <input type="email" formControlName="email" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Contraseña:</label>
      <input type="password" formControlName="password" style="width: 100%; padding: 0.5rem;">
    </div>

    <button type="submit" [disabled]="loginForm.invalid" style="padding: 0.8rem; background: #ff9800; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Entrar
    </button>

  </form>
</div>
