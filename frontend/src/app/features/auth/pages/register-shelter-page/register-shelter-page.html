<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Registro de Protectora</h2>
      <p class="text-muted">Únete a nuestra red de adopción responsable</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="name">Nombre de la Protectora</label>
        <input type="text" id="name" formControlName="name" placeholder="Ej. Refugio Esperanza" class="form-control">
      </div>

      <div class="form-group">
        <label for="email">Email de contacto</label>
        <input type="email" id="email" formControlName="email" placeholder="protectora@ejemplo.com" class="form-control">
      </div>

      <div class="form-group">
        <label for="password">Contraseña (mín 6 carácteres)</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••" class="form-control">
      </div>

      <div class="form-group">
        <label for="contactPhone">Teléfono</label>
        <input type="text" id="contactPhone" formControlName="contactPhone" placeholder="Ej. 600 123 456" class="form-control">
      </div>

      <div class="form-group">
        <label for="address">Dirección física</label>
        <input type="text" id="address" formControlName="address" placeholder="Calle, Ciudad, Código Postal..." class="form-control">
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-primary btn-block">
        Crear Cuenta de Protectora
      </button>

    </form>
  </div>
</div>
