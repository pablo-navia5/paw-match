<div style="max-width: 400px; margin: 3rem auto; font-family: sans-serif; padding: 2rem; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Registro de Protectora</h2>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1rem;">

    <div>
      <label>Nombre de la Protectora:</label>
      <input type="text" formControlName="name" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Email de contacto:</label>
      <input type="email" formControlName="email" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Contraseña (mín 6 carácteres):</label>
      <input type="password" formControlName="password" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Teléfono:</label>
      <input type="text" formControlName="contactPhone" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Dirección física:</label>
      <input type="text" formControlName="address" style="width: 100%; padding: 0.5rem;">
    </div>

    <button type="submit" [disabled]="registerForm.invalid" style="padding: 0.8rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Crear Cuenta de Protectora
    </button>

  </form>
</div>
