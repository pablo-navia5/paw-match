<div style="max-width: 400px; margin: 3rem auto; padding: 2rem; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
  <h2>Añadir Nueva Mascota</h2>

  <form [formGroup]="petForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label>Nombre:</label>
      <input type="text" formControlName="name" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>Especie:</label>
      <select formControlName="species" style="width: 100%; padding: 0.5rem;">
        <option value="Perro">Perro</option>
        <option value="Gato">Gato</option>
      </select>
    </div>

    <div>
      <label>Edad:</label>
      <input type="number" formControlName="age" style="width: 100%; padding: 0.5rem;">
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="requiredHoursPerDay">
        ¿Requiere horas al dia?
      </label>
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="requiresExperiencedOwner">
        ¿Requiere dueño experimentado?
      </label>
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="goodWithChildren">
        ¿Es bueno con niños pequeños?
      </label>
    </div>

    <div>
      <label>
        <input type="checkbox" formControlName="goodWithOtherPets">
        ¿Es bueno con otras mascotas?
      </label>
    </div>

    <div>
      <label>Edad:</label>
      <input type="number" formControlName="energyLevel" style="width: 100%; padding: 0.5rem;">
    </div>

    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
      <button type="button" routerLink="/shelter-panel" style="flex: 1; padding: 0.8rem; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Cancelar
      </button>
      <button type="submit" [disabled]="petForm.invalid" style="flex: 1; padding: 0.8rem; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Guardar
      </button>
    </div>
  </form>
</div>
