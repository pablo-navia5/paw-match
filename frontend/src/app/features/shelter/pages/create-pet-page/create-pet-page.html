<div class="form-wrapper">
  <div class="form-card">
    <div class="form-header">
      <h2>Añadir Nueva Mascota</h2>
      <p class="text-muted">Completa el perfil para que el sistema encuentre al adoptante ideal.</p>
    </div>

    <form [formGroup]="petForm" (ngSubmit)="onSubmit()" class="modern-form">
      <h3 class="section-title">Datos Básicos</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" formControlName="name" placeholder="Ej. Max" class="form-control">
        </div>

        <div class="form-group">
          <label for="species">Especie</label>
          <select id="species" formControlName="species" class="form-control">
            <option value="" disabled selected>Selecciona una especie...</option>
            <option value="Perro">Perro</option>
            <option value="Gato">Gato</option>
          </select>
        </div>

        <div class="form-group">
          <label for="age">Edad (años)</label>
          <input type="number" id="age" formControlName="age" placeholder="Ej. 3" class="form-control">
        </div>

        <div class="form-group full-width">
          <label for="imageUpload">Foto de la Mascota</label>
          <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/webp" (change)="onFileSelected($event)" class="form-control file-input">

          @if (imagePreviewUrl()) {
            <div class="image-preview">
              <img [src]="imagePreviewUrl()" alt="Vista previa de la mascota">
            </div>
          }
        </div>
      </div>

      <hr class="divider">

      <h3 class="section-title">Requisitos de Adopción</h3>
      <div class="form-grid">

        <div class="form-group">
          <label for="requiredHoursPerDay">Horas de atención diarias requeridas</label>
          <input type="number" id="requiredHoursPerDay" formControlName="requiredHoursPerDay" placeholder="Ej. 2" class="form-control">
        </div>

        <div class="form-group">
          <label for="energyLevel">Nivel de energía (1-Bajo, 2-Medio, 3-Alto)</label>
          <input type="number" id="energyLevel" formControlName="energyLevel" min="1" max="3" class="form-control">
        </div>

        <div class="form-group">
          <label for="requiredHouseSize">Tamaño de vivienda mínimo</label>
          <select id="requiredHouseSize" formControlName="requiredHouseSize" class="form-control">
            <option value="Pequeña">Pequeña (Piso)</option>
            <option value="Mediana">Mediana (Adosado)</option>
            <option value="Grande">Grande (Finca/Chalet)</option>
          </select>
        </div>

      </div>

      <div class="checkbox-grid">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="needsYard" class="custom-checkbox">
          <span>Requiere jardín obligatorio</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" formControlName="requiresExperiencedOwner" class="custom-checkbox">
          <span>Requiere dueño experimentado</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" formControlName="goodWithChildren" class="custom-checkbox">
          <span>Compatible con niños pequeños</span>
        </label>

        <label class="checkbox-label">
          <input type="checkbox" formControlName="goodWithOtherPets" class="custom-checkbox">
          <span>Compatible con otras mascotas</span>
        </label>
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/shelter-panel" class="btn-secondary">
          Cancelar
        </button>
        <button type="submit" [disabled]="petForm.invalid || isLoading()" class="btn-primary">
          @if (isLoading()) {
            Guardando mascota...
          } @else {
            Guardar Mascota
          }
        </button>
      </div>
    </form>
  </div>
</div>
