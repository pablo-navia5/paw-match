<header class="app-navbar">
  <div class="brand">
    <span class="brand-icon">🐾</span>
    <span class="brand-text">PawMatch</span>
  </div>
  <button class="btn-profile">
    Mi Perfil
  </button>
</header>

<main class="discover-container">
  @if (isLoading()) {
    <div class="status-view">
      <div class="spinner"></div>
      <h3>Buscando compañeros...</h3>
    </div>
  } @else {
    @if (currentPet) {
      <div class="swipe-area">
        <div class="pet-card">
          <img src="https://placehold.co/600x800/ffefe5/ff7e67?text={{ currentPet.name }}" alt="{{ currentPet.name }}">

          <div class="pet-info-overlay">
            <h2>{{ currentPet.name }}, {{ currentPet.age }}</h2>
            <p class="species-tag">{{ currentPet.species }}</p>
          </div>
        </div>

        <div class="action-controls">
          <button class="action-btn btn-pass" (click)="nextPet('pass')">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
          <button class="action-btn btn-like" (click)="nextPet('like')">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
          </button>
        </div>
      </div>
    } @else {
      <div class="status-view empty">
        <div class="empty-icon">🏠</div>
        <h2>Estás al día</h2>
        <p>No hay más peludos cerca de ti en este momento. Vuelve a comprobarlo más tarde.</p>
      </div>
    }
  }
</main>
